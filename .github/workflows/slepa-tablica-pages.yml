# Wystawia Ślepą Tablicę na GitHub Pages, żeby dało się ją komuś podać linkiem.
# Zanim zadziała: Settings → Pages → Source = GitHub Actions (raz, ręcznie).
name: Ślepa Tablica na Pages

on:
  push:
    branches: [claude/medical-learning-app-flashcards-900j2t]
    paths: ["slepa-tablica/**", ".github/workflows/slepa-tablica-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slepa-tablica
      - id: deploy
        uses: actions/deploy-pages@v4
